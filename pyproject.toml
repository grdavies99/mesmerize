[project]
name = "mesmerize"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "zeroconf>=0.136.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mesmerize"]
